<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titanic Survival Predictor</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, select { margin: 10px; padding: 8px; width: 200px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Titanic Survival Predictor</h2>
        <form action="/predict" method="post">
            <select name="pclass"><option value="1">1st Class</option><option value="2">2nd Class</option><option value="3">3rd Class</option></select><br>
            <select name="sex"><option value="1">Female</option><option value="0">Male</option></select><br>
            <input type="number" name="age" placeholder="Age" required><br>
            <input type="number" name="sibsp" placeholder="Siblings/Spouses" required><br>
            <input type="number" name="parch" placeholder="Parents/Children" required><br>
            <input type="number" step="0.01" name="fare" placeholder="Fare Paid" required><br>
            <select name="embarked"><option value="0">Southampton</option><option value="1">Cherbourg</option><option value="2">Queenstown</option></select><br>
            <button type="submit">Will they survive?</button>
        </form>
    </div>
</body>
</html>
